<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>McTraining Portal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Main theme CSS -->
  <link rel="stylesheet" href="mc-theme.css" />
</head>

<body>

  <!-- ============================
       SIDEBAR
  ============================= -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div id="avatarCircle" class="avatar-circle">U</div>
      <div class="sidebar-user-info">
        <div id="sidebarUserName" class="user-name">User</div>
        <div id="sidebarUserRole" class="user-role">Crew</div>
      </div>
    </div>

    <nav class="sidebar-links">
      <button id="sidebarToggle" class="sidebar-close-btn">☰</button>

      <a class="nav-item active">Dashboard</a>
      <a class="nav-item">Training</a>
      <a class="nav-item">McAssist</a>
    </nav>

    <button id="logoutBtn" class="logout-btn">Log out</button>
  </aside>

  <!-- Mobile toggle button -->
  <button id="sidebarToggle" class="sidebar-toggle-btn">☰</button>


  <!-- ============================
       MAIN CONTENT
  ============================= -->
  <main class="main">

    <!-- Header Welcome -->
    <section class="header-section">
      <div class="header-top">
        <div>
          <h2 id="welcomeTitle">Welcome back</h2>
          <p id="welcomeSubtitle">Here’s your week at a glance.</p>
        </div>

        <span id="roleBadge" class="role-badge">Crew</span>
      </div>
    </section>


    <!-- ============================
         TOP CARDS (HOURS/SALES)
    ============================= -->
    <section id="topCards" class="card-grid">
      <!-- Populated by JS -->
    </section>


    <!-- ============================
         BOTTOM SECTION (SCHEDULE/WASTE)
    ============================= -->
    <section id="bottomSection" class="bottom-section">
      <!-- Populated by JS -->
    </section>


    <!-- ============================
         MCASSIST AI CHAT
    ============================= -->
    <section class="ai-section">
      <h3>McAssist</h3>
      <p id="aiSubtitle" class="ai-subtitle">
        Ask about your hours, pay, shifts, or training.
      </p>

      <div id="aiSuggestions" class="suggestions-row">
        <!-- Chips added by JS -->
      </div>

      <div id="aiChat" class="chat-box">
        <!-- Messages loaded by JS -->
      </div>

      <form id="aiForm" class="chat-input-row">
        <input
          id="aiInput"
          class="chat-input"
          type="text"
          placeholder="Ask McAssist something…"
        />
        <button id="aiSendBtn" class="send-btn">➤</button>

        <!-- Voice Mode Button -->
        <button type="button" id="aiMicBtn" class="voice-btn">🎤</button>
      </form>

      <!-- Wake word toggle -->
      <label class="wake-toggle">
        <input type="checkbox" id="wakeToggle">
        <span>Enable “Hey Amy”</span>
      </label>
    </section>

  </main>


  <!-- ============================
       VOICE OVERLAY
  ============================= -->
  <div id="voiceOverlay" class="voice-overlay">
    <div id="overlayText" class="overlay-text">Ask me anything</div>

    <!-- McDonald’s Style STOP Button -->
    <button id="overlayMic" class="overlay-mic-btn">
      🎤
    </button>
  </div>


  <!-- JS -->
  <script type="module" src="main.js"></script>
</body>
</html>
