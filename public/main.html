<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>McTraining Portal - Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Shared McDonald's theme -->
  <link rel="stylesheet" href="mc-theme.css" />
</head>
<body class="app-page">
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="logo-circle">M</div>
      <div class="sidebar-header-text">
        <h1>McTraining</h1>
        <p>Powered by McAssist AI</p>
      </div>
    </div>

    <div class="nav-section-title">Main</div>
    <ul class="nav-list">
      <li class="nav-item active" onclick="location.href='main.html'">
        <span class="nav-dot"></span>
        <span>Dashboard</span>
      </li>
      <li class="nav-item" onclick="location.href='training.html'">
        <span class="emoji">📚</span>
        <span>Training</span>
      </li>
      <li class="nav-item">
        <span class="emoji">🧑‍🍳</span>
        <span>Stations</span>
      </li>
      <li class="nav-item">
        <span class="emoji">🕒</span>
        <span>Shifts</span>
      </li>
    </ul>

    <div class="sidebar-footer">
      Signed in as<br />
      <strong id="sidebarUserName">—</strong><br />
      <span id="sidebarUserRole">—</span>
      <div>
        <button id="logoutBtn">Log out</button>
      </div>
    </div>
  </aside>

  <main class="main-layout">
    <section class="content-area">
      <div class="top-bar">
        <div class="top-bar-left">
          <h2 id="welcomeTitle">Welcome</h2>
          <p id="welcomeSubtitle">Loading your dashboard…</p>
        </div>
        <div class="top-bar-right">
          <span class="chip" id="statusChip">
            <span>🍟</span>
            <span>Live data + AI</span>
          </span>
          <span class="badge-role" id="roleBadge">Role</span>
          <div class="avatar" id="avatarCircle">U</div>
        </div>
      </div>

      <div class="cards-grid" id="topCards"></div>

      <div class="card section-card" id="bottomSection"></div>
    </section>

    <aside class="ai-panel">
      <div class="ai-header">
        <div class="ai-header-left">
          <div class="ai-avatar">🤖</div>
          <div class="ai-header-text">
            <h3>McAssist</h3>
            <p id="aiSubtitle">Ask me about hours, pay or store performance</p>
          </div>
        </div>
        <div class="ai-status">
          <span class="ai-status-dot"></span>
          <span>Online</span>
        </div>
      </div>

      <div class="ai-suggestions" id="aiSuggestions"></div>

      <div class="ai-chat" id="aiChat"></div>

      <form class="ai-input-row" id="aiForm">
        <input
          type="text"
          id="aiInput"
          placeholder="Ask McAssist anything about your shift or store…"
          autocomplete="off"
        />
        <button type="submit" class="ai-send-btn" id="aiSendBtn">
          <span>Send</span>
          <span>↗</span>
        </button>
      </form>
    </aside>
  </main>

  <!-- All logic lives here -->
  <script type="module" src="main.js"></script>
</body>
</html>
