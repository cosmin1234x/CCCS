<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>McTraining Portal – Shifts</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="mc-theme.css" />
</head>

<body class="app-page">

  <!-- ========= SIDEBAR ========= -->
<ul class="nav-list">
  <li class="nav-item">
    <a class="nav-link" href="main.html">
      <span class="nav-dot"></span><span class="nav-icon">🏠</span><span class="nav-label">Dashboard</span>
    </a>
  </li>

  <li class="nav-item">
    <a class="nav-link" href="training.html">
      <span class="nav-dot"></span><span class="nav-icon">🎓</span><span class="nav-label">Training</span>
    </a>
  </li>

  <li class="nav-item">
    <a class="nav-link" href="schedule.html">
      <span class="nav-dot"></span><span class="nav-icon">📅</span><span class="nav-label">Shifts</span>
    </a>
  </li>

  <li class="nav-item">
    <a class="nav-link" href="break-rewards.html">
      <span class="nav-dot"></span><span class="nav-icon">🍔</span><span class="nav-label">Break Rewards</span>
    </a>
  </li>

  <li class="nav-item" id="navShiftCreator" style="display:none;">
    <a class="nav-link" href="shifts-admin.html">
      <span class="nav-dot"></span><span class="nav-icon">🛠️</span><span class="nav-label">Shift creator</span>
    </a>
  </li>
</ul>


  <!-- ========= MAIN LAYOUT ========= -->
  <div class="main-layout">
    <div class="content-area">

      <div class="top-bar">
        <div class="top-bar-left">
          <h2 id="scheduleTitle">Weekly schedule</h2>
          <p id="scheduleSubtitle">
            See your shifts for this week and upcoming weeks.
          </p>
        </div>
        <div class="top-bar-right">
          <span id="roleBadge" class="badge-role">Crew</span>
          <div id="avatarCircle" class="avatar">U</div>
        </div>
      </div>

      <!-- Week selector -->
      <div class="card section-card" style="margin-top:6px;">
        <div class="subsection-title">Week selection</div>
        <div class="subsection-sub">
          Switch between this week and next week. If no schedule exists, you'll see a message.
        </div>
        <div id="weekTabs" style="margin-top:6px; display:flex; gap:6px; flex-wrap:wrap;">
          <button class="pill-filter active" data-week-offset="0">This week</button>
          <button class="pill-filter" data-week-offset="1">Next week</button>
        </div>
      </div>

      <!-- Schedule card -->
      <section id="scheduleCard" class="card section-card" style="margin-top:10px;">
        <!-- Filled by schedule.js -->
      </section>

      <!-- Manager-only: shift creation + auto-generate -->
      <section id="shiftManageCard" class="card section-card" style="margin-top:10px;">
        <!-- Filled by schedule.js for managers; hidden for crew -->
      </section>

    </div>
  </div>

  <!-- ✅ IMPORTANT: nav.js FIRST -->
  <script type="module" src="nav.js"></script>
  <script type="module" src="schedule.js"></script>

</body>
</html>
