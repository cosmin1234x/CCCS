<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>McTraining Portal - Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="./mc-theme.css?v=cartoon-1" />
</head>
<body class="auth-page">
  <div class="login-container auth-shell">
    <div class="login-header auth-header">
      <div class="logo-circle">M</div>
      <div class="auth-header-text">
        <h1>Welcome back</h1>
        <p>Log in to the McTraining portal.</p>
      </div>
    </div>

    <div class="tagline"><span>🍟</span><span>Fast, friendly crew training dashboard</span></div>

    <form id="loginForm" class="auth-form">
      <div class="field-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="e.g. alex@restaurant.com" required />
      </div>

      <div class="field-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Your password" required />
      </div>

      <button type="submit" class="login-button" id="loginButton">
        <span>🍔</span>
        <span>Sign in</span>
      </button>

      <div id="error" class="error" style="display:none;"></div>
    </form>

    <div class="link-row">
      Need an account? <a href="signup.html">Create one</a>
    </div>
  </div>

  <script type="module">
    import { auth, db } from "./firebase-init.js";
    import {
      signInWithEmailAndPassword,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import {
      doc,
      getDoc
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const loginForm = document.getElementById("loginForm");
    const errorBox = document.getElementById("error");
    const loginButton = document.getElementById("loginButton");

    // 🔁 Auto-login / remember me
    onAuthStateChanged(auth, async (user) => {
      if (!user) return;

      try {
        const existing = localStorage.getItem("mc_session_user");
        if (existing) {
          window.location.href = "main.html";
          return;
        }

        const profileRef = doc(db, "users", user.uid);
        const snap = await getDoc(profileRef);

        let profile = {
          name: user.displayName || user.email || "User",
          role: "crew",
          storeId: "store001"
        };

        if (snap.exists()) {
          const data = snap.data();
          profile = {
            name: data.name || profile.name,
            role: data.role || profile.role,
            storeId: data.storeId || profile.storeId
          };
        }

        const sessionUser = {
          id: user.uid,
          role: profile.role,
          name: profile.name,
          storeId: profile.storeId
        };

        localStorage.setItem("mc_session_user", JSON.stringify(sessionUser));
        window.location.href = "main.html";
      } catch (e) {
        console.error("Auto-login failed:", e);
      }
    });

    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      errorBox.style.display = "none";
      errorBox.textContent = "";

      if (!email || !password) {
        showError("Please fill in all fields.");
        return;
      }

      loginButton.disabled = true;

      try {
        const cred = await signInWithEmailAndPassword(auth, email, password);

        const profileRef = doc(db, "users", cred.user.uid);
        const snap = await getDoc(profileRef);

        let profile = {
          name: cred.user.displayName || cred.user.email || "User",
          role: "crew",
          storeId: "store001"
        };

        if (snap.exists()) {
          const data = snap.data();
          profile = {
            name: data.name || profile.name,
            role: data.role || profile.role,
            storeId: data.storeId || profile.storeId
          };
        }

        const sessionUser = {
          id: cred.user.uid,
          role: profile.role,
          name: profile.name,
          storeId: profile.storeId
        };

        localStorage.setItem("mc_session_user", JSON.stringify(sessionUser));
        window.location.href = "main.html";
      } catch (err) {
        console.error(err);
        if (err.code === "auth/user-not-found") {
          showError("No account found with that email.");
        } else if (err.code === "auth/wrong-password") {
          showError("Incorrect password.");
        } else if (err.code === "auth/invalid-credential") {
          showError("Invalid email or password. Please check and try again.");
        } else {
          showError("Login failed. " + (err.message || ""));
        }
      } finally {
        loginButton.disabled = false;
      }
    });

    function showError(msg) {
      errorBox.textContent = msg;
      errorBox.style.display = "block";
    }
  </script>
</body>
</html>
