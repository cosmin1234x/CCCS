<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin - Manage Roles</title>
  <style>
    :root{
      --mc-red:#d62828; --mc-yellow:#ffcc00; --bg:#0b0b0c;
      --card: rgba(255,255,255,.96); --muted:#666;
    }
    *{box-sizing:border-box;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
    body{
      margin:0; min-height:100vh; display:flex; align-items:flex-start; justify-content:center;
      padding:24px; background: radial-gradient(circle at top, #ffd166, #ff9f1c, #d62828);
    }
    .wrap{width:100%; max-width:980px}
    .topbar{
      background:var(--card); border-radius:16px; padding:16px 18px; display:flex; gap:12px;
      align-items:center; justify-content:space-between; box-shadow:0 14px 35px rgba(0,0,0,.22);
      margin-bottom:14px;
    }
    .brand{display:flex; align-items:center; gap:10px}
    .logo{
      width:40px; height:40px; border-radius:999px; background:var(--mc-red);
      color:var(--mc-yellow); display:flex; align-items:center; justify-content:center;
      font-weight:900; font-size:22px;
    }
    .meta small{color:var(--muted)}
    .btn{
      border:none; border-radius:999px; padding:10px 14px; font-weight:700; cursor:pointer;
      background:linear-gradient(135deg,var(--mc-red),#a71d1d); color:#fff;
      box-shadow:0 10px 18px rgba(0,0,0,.25);
    }
    .btn.secondary{background:#111; color:#fff}
    .grid{
      display:grid; grid-template-columns: 1fr; gap:12px;
    }
    .card{
      background:var(--card); border-radius:16px; padding:16px 18px;
      box-shadow:0 14px 35px rgba(0,0,0,.22);
    }
    .row{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
    input,select{
      border-radius:999px; border:1px solid #ddd; padding:9px 12px; background:#fafafa; outline:none;
    }
    input:focus,select:focus{border-color:var(--mc-red); box-shadow:0 0 0 2px rgba(214,40,40,.15); background:#fff}
    .table{
      width:100%; border-collapse:separate; border-spacing:0 10px;
    }
    .table th{font-size:12px; text-align:left; color:#333; padding:0 10px}
    .table td{
      background:#fff; padding:12px 10px; border-top:1px solid #eee; border-bottom:1px solid #eee;
    }
    .table tr td:first-child{border-left:1px solid #eee; border-top-left-radius:12px; border-bottom-left-radius:12px}
    .table tr td:last-child{border-right:1px solid #eee; border-top-right-radius:12px; border-bottom-right-radius:12px}
    .pill{
      display:inline-flex; align-items:center; gap:6px; padding:6px 10px; border-radius:999px;
      background:rgba(214,40,40,.08); color:#8b1a1a; font-weight:700; font-size:12px;
    }
    .muted{color:var(--muted); font-size:12px}
    .warn{color:#b45309; font-size:12px}
    .ok{color:#15803d; font-size:12px}
    .hidden{display:none}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div class="brand">
        <div class="logo">M</div>
        <div class="meta">
          <div style="font-weight:800">Admin – Manage Roles</div>
          <small id="whoami">Checking access…</small>
        </div>
      </div>
      <div class="row">
        <button id="backBtn" class="btn secondary" type="button">← Back</button>
        <button id="logoutBtn" class="btn" type="button">Log out</button>
      </div>
    </div>

    <div class="grid">
      <div class="card">
        <div class="row" style="justify-content:space-between;">
          <div class="row">
            <input id="search" type="text" placeholder="Search name/email…" style="min-width:260px;"/>
            <span class="pill" id="storePill">Store: -</span>
          </div>
          <div class="row">
            <label class="muted"><input id="toggleStoreEdit" type="checkbox"/> allow editing storeId</label>
            <button id="refreshBtn" class="btn secondary" type="button">Refresh</button>
          </div>
        </div>
        <div id="status" class="muted" style="margin-top:10px;"></div>
        <div id="error" class="warn hidden" style="margin-top:10px;"></div>
      </div>

      <div class="card">
        <table class="table">
          <thead>
            <tr>
              <th style="width:30%">Name</th>
              <th style="width:26%">Email</th>
              <th style="width:14%">Role</th>
              <th style="width:14%">Store</th>
              <th style="width:16%">Actions</th>
            </tr>
          </thead>
          <tbody id="tbody">
            <tr><td colspan="5" class="muted">Loading…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script type="module">
    import { auth, db } from "./firebase-init.js";
    import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import {
      doc, getDoc, collection, getDocs, query, where, updateDoc
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const whoami = document.getElementById("whoami");
    const storePill = document.getElementById("storePill");
    const tbody = document.getElementById("tbody");
    const status = document.getElementById("status");
    const errorBox = document.getElementById("error");
    const search = document.getElementById("search");
    const refreshBtn = document.getElementById("refreshBtn");
    const logoutBtn = document.getElementById("logoutBtn");
    const backBtn = document.getElementById("backBtn");
    const toggleStoreEdit = document.getElementById("toggleStoreEdit");

    let me = null;              // { uid, name, role, storeId }
    let users = [];             // loaded users in store

    function showError(msg){
      errorBox.textContent = msg;
      errorBox.classList.remove("hidden");
    }
    function clearError(){
      errorBox.textContent = "";
      errorBox.classList.add("hidden");
    }
    function isManagerLike(role){
      return role === "manager" || role === "shiftCreator";
    }
    function escapeHtml(s){
      return String(s ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }

    async function loadMe(uid){
      const snap = await getDoc(doc(db, "users", uid));
      if (!snap.exists()) throw new Error("Your user profile doc does not exist in /users yet.");
      const d = snap.data();
      return { uid, name: d.name || "User", role: d.role || "crew", storeId: d.storeId || "store001", email: d.email || "" };
    }

    async function loadUsersInMyStore(){
      clearError();
      status.textContent = "Loading users…";

      // Query all users where storeId == myStore
      const qy = query(collection(db, "users"), where("storeId", "==", me.storeId));
      const snap = await getDocs(qy);

      users = [];
      snap.forEach(docSnap => {
        const d = docSnap.data();
        users.push({
          id: docSnap.id,
          name: d.name || "(no name)",
          email: d.email || "",
          role: d.role || "crew",
          storeId: d.storeId || ""
        });
      });

      status.textContent = `Loaded ${users.length} user(s).`;
      render();
    }

    function render(){
      const term = search.value.trim().toLowerCase();
      const allowStoreEdit = toggleStoreEdit.checked;

      const filtered = users.filter(u => {
        if (!term) return true;
        return (u.name || "").toLowerCase().includes(term) || (u.email || "").toLowerCase().includes(term);
      });

      if (!filtered.length){
        tbody.innerHTML = `<tr><td colspan="5" class="muted">No matches.</td></tr>`;
        return;
      }

      tbody.innerHTML = filtered.map(u => {
        const isSelf = u.id === me.uid;
        return `
          <tr data-id="${escapeHtml(u.id)}">
            <td>
              <div style="font-weight:800">${escapeHtml(u.name)}</div>
              ${isSelf ? `<div class="ok">This is you</div>` : `<div class="muted">${escapeHtml(u.id)}</div>`}
            </td>
            <td>${escapeHtml(u.email)}</td>
            <td>
              <select class="roleSel" ${isSelf ? "" : ""}>
                <option value="crew" ${u.role==="crew"?"selected":""}>crew</option>
                <option value="manager" ${u.role==="manager"?"selected":""}>manager</option>
                <option value="shiftCreator" ${u.role==="shiftCreator"?"selected":""}>shiftCreator</option>
              </select>
              <div class="muted">current: <b>${escapeHtml(u.role)}</b></div>
            </td>
            <td>
              ${
                allowStoreEdit
                  ? `<input class="storeInput" value="${escapeHtml(u.storeId)}" style="width:120px" />`
                  : `<span class="pill">${escapeHtml(u.storeId)}</span>`
              }
            </td>
            <td>
              <button class="btn secondary saveBtn" type="button">Save</button>
            </td>
          </tr>
        `;
      }).join("");

      tbody.querySelectorAll(".saveBtn").forEach(btn => {
        btn.addEventListener("click", () => onSave(btn));
      });
    }

    async function onSave(btn){
      clearError();
      const tr = btn.closest("tr");
      const uid = tr.dataset.id;

      const roleSel = tr.querySelector(".roleSel");
      const newRole = roleSel.value;

      const allowStoreEdit = toggleStoreEdit.checked;
      const storeInput = tr.querySelector(".storeInput");
      const newStoreId = allowStoreEdit ? (storeInput.value.trim() || me.storeId) : null;

      // Safety: don’t let you accidentally lock yourself out
      if (uid === me.uid && !isManagerLike(newRole)) {
        const ok = confirm("You are changing YOUR OWN role away from manager/shiftCreator.\nYou may lose access to this admin page.\nContinue?");
        if (!ok) return;
      }

      btn.disabled = true;
      btn.textContent = "Saving…";

      try{
        const patch = { role: newRole };

        // storeId edit is optional; only apply if enabled
        if (allowStoreEdit) patch.storeId = newStoreId;

        await updateDoc(doc(db, "users", uid), patch);

        // update local cache
        const idx = users.findIndex(x => x.id === uid);
        if (idx !== -1){
          users[idx].role = newRole;
          if (allowStoreEdit) users[idx].storeId = newStoreId;
        }

        // if you edited yourself, update me too
        if (uid === me.uid){
          me.role = newRole;
          if (allowStoreEdit) me.storeId = newStoreId;
          whoami.textContent = `${me.name} · ${me.role} · ${me.storeId}`;
          storePill.textContent = `Store: ${me.storeId}`;
        }

        btn.textContent = "Saved ✓";
        setTimeout(() => { btn.textContent = "Save"; btn.disabled = false; }, 700);
      }catch(e){
        console.error(e);
        showError(e?.message || "Save failed (permissions?)");
        btn.textContent = "Save";
        btn.disabled = false;
      }
    }

    // Events
    search.addEventListener("input", render);
    refreshBtn.addEventListener("click", loadUsersInMyStore);
    toggleStoreEdit.addEventListener("change", render);

    logoutBtn.addEventListener("click", async () => {
      await signOut(auth);
      localStorage.removeItem("mc_session_user");
      window.location.href = "index.html";
    });

    backBtn.addEventListener("click", () => {
      // go back to your dashboard
      window.location.href = "main.html";
    });

    // Auth gate
    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = "index.html";
        return;
      }

      try{
        me = await loadMe(user.uid);

        // Only allow manager/shiftCreator
        if (!isManagerLike(me.role)) {
          whoami.textContent = `${me.name} · ${me.role} · ${me.storeId}`;
          showError("Access denied: only manager/shiftCreator can use this page.");
          tbody.innerHTML = `<tr><td colspan="5" class="warn">Not allowed.</td></tr>`;
          return;
        }

        whoami.textContent = `${me.name} · ${me.role} · ${me.storeId}`;
        storePill.textContent = `Store: ${me.storeId}`;

        await loadUsersInMyStore();
      }catch(e){
        console.error(e);
        showError(e?.message || "Failed to load admin page.");
        tbody.innerHTML = `<tr><td colspan="5" class="warn">Failed to load.</td></tr>`;
      }
    });
  </script>
</body>
</html>
