<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>McTraining Wrapped</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="mc-theme.css" />

  <style>
    :root{
      --bg1:#0b1220;
      --bg2:#111827;
      --card:#0f172a;
      --card2:#111827;
      --text:#f9fafb;
      --muted:#cbd5e1;
      --line:rgba(255,255,255,0.10);
      --accent:#facc15;
      --accent2:#22c55e;
      --danger:#fb7185;
      --radius:18px;
      --shadow:0 18px 40px rgba(0,0,0,0.45);
    }

    body.app-page{
      background: radial-gradient(1200px 800px at 10% 10%, rgba(250,204,21,0.18), transparent 55%),
                  radial-gradient(1000px 700px at 85% 25%, rgba(34,197,94,0.14), transparent 55%),
                  linear-gradient(180deg, var(--bg1), var(--bg2));
      color: var(--text);
    }

    .wrapped-layout{
      flex:1;
      display:flex;
      flex-direction:column;
      gap:14px;
      padding: 14px;
      max-width: 980px;
      margin: 0 auto;
    }

    .wrapped-topbar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:10px;
    }
    .brand .logo{
      width:40px;height:40px;border-radius:14px;
      display:flex;align-items:center;justify-content:center;
      font-weight:900;
      background: linear-gradient(135deg, #d9091c, #a30716);
      box-shadow: 0 10px 20px rgba(217,9,28,0.35);
    }
    .brand .txt h1{ font-size:1.05rem; margin:0; font-weight:900; }
    .brand .txt p{ margin:0; font-size:0.78rem; color:var(--muted); }

    .btn{
      border-radius:999px;
      border:1px solid var(--line);
      background: rgba(255,255,255,0.06);
      color: var(--text);
      padding: 9px 12px;
      font-weight:800;
      cursor:pointer;
      display:inline-flex;
      align-items:center;
      gap:8px;
    }
    .btn:hover{ background: rgba(255,255,255,0.10); }
    .btn-primary{
      border:none;
      background: linear-gradient(135deg, #facc15, #22c55e);
      color:#111827;
      box-shadow: 0 14px 26px rgba(250,204,21,0.18);
    }

    .story-shell{
      border:1px solid var(--line);
      background: rgba(255,255,255,0.04);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow:hidden;
    }

    .progress{
      display:flex;
      gap:6px;
      padding: 12px;
      border-bottom:1px solid var(--line);
      background: rgba(255,255,255,0.03);
    }
    .bar{
      flex:1;
      height:6px;
      border-radius:999px;
      background: rgba(255,255,255,0.12);
      overflow:hidden;
    }
    .bar > div{
      height:100%;
      width:0%;
      background: linear-gradient(90deg, #facc15, #22c55e);
      transition: width .25s ease;
    }

    .story{
      min-height: 440px;
      display:flex;
      flex-direction:column;
      padding: 18px;
      gap: 12px;
      position:relative;
      user-select:none;
    }

    .story-kicker{
      font-size:0.78rem;
      letter-spacing:0.12em;
      text-transform:uppercase;
      color: rgba(249,250,251,0.7);
      font-weight:800;
    }
    .story-title{
      font-size:1.5rem;
      font-weight:950;
      line-height:1.1;
      margin-top:2px;
    }
    .story-sub{
      font-size:0.9rem;
      color: var(--muted);
      line-height:1.5;
      max-width: 62ch;
    }

    .grid{
      margin-top:8px;
      display:grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    @media (max-width: 720px){
      .grid{ grid-template-columns: 1fr; }
      .story{ min-height: 520px; }
    }

    .stat{
      border:1px solid var(--line);
      background: rgba(17,24,39,0.6);
      border-radius: 16px;
      padding: 12px;
    }
    .stat .label{ font-size:0.75rem; color: rgba(249,250,251,0.72); font-weight:800; }
    .stat .value{ margin-top:6px; font-size:1.1rem; font-weight:950; }
    .stat .mini{ margin-top:4px; font-size:0.78rem; color: var(--muted); }

    .tagrow{ display:flex; flex-wrap:wrap; gap:8px; margin-top:6px; }
    .pill{
      padding: 6px 10px;
      border-radius: 999px;
      border:1px solid var(--line);
      background: rgba(255,255,255,0.06);
      font-weight:800;
      font-size:0.78rem;
      color: var(--text);
    }

    .navhint{
      margin-top:auto;
      display:flex;
      justify-content:space-between;
      gap:10px;
      align-items:center;
      color: rgba(249,250,251,0.7);
      font-size:0.78rem;
    }

    .footer-actions{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      justify-content:space-between;
      align-items:center;
      margin-top: 10px;
    }

    .toast{
      position: fixed;
      right: 16px;
      bottom: 16px;
      z-index: 1200;
      padding: 10px 12px;
      border-radius: 14px;
      background: #111827;
      color: #f9fafb;
      font-size: 0.8rem;
      box-shadow: 0 14px 30px rgba(15, 23, 42, 0.8);
      display: none;
      max-width: 300px;
    }
    .toast.show{ display:block; }
  </style>
</head>

<body class="app-page">
  <div class="wrapped-layout">

    <div class="wrapped-topbar">
      <div class="brand">
        <div class="logo">M</div>
        <div class="txt">
          <h1>McTraining Wrapped</h1>
          <p>Your training year, in 6 slides.</p>
        </div>
      </div>

      <div style="display:flex; gap:10px; flex-wrap:wrap;">
        <button id="backBtn" class="btn" type="button">← Back</button>
        <button id="shareBtn" class="btn btn-primary" type="button">📸 Save share card</button>
      </div>
    </div>

    <div class="story-shell" id="storyShell">
      <div class="progress" id="progressBars"></div>

      <div class="story" id="story">
        <!-- filled by wrapped.js -->
      </div>

      <div class="footer-actions">
        <div style="display:flex; gap:10px;">
          <button id="prevBtn" class="btn" type="button">◀ Prev</button>
          <button id="nextBtn" class="btn" type="button">Next ▶</button>
        </div>
        <div style="font-size:0.78rem; color: rgba(249,250,251,0.65);">
          Tip: tap/click left or right to navigate.
        </div>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script type="module" src="wrapped.js"></script>
</body>
</html>
