<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>McTraining Portal – Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- ✅ SET THIS:
       content=""           if your URL is https://amyai.space/main
       content="/mctraining" if your URL is https://amyai.space/mctraining/main
  -->
  <meta name="app-base" content="">

  <!-- ✅ Load CSS using app-base (prevents 404 on /main or /main/) -->
  <script>
    (function () {
      const meta = document.querySelector('meta[name="app-base"]');
      const BASE = (meta?.content || "").replace(/\/$/, ""); // no trailing slash
      const css = document.createElement("link");
      css.rel = "stylesheet";
      css.href = (BASE ? BASE + "/" : "/") + "mc-theme.css";
      document.head.appendChild(css);
      window.__APP_BASE__ = BASE;
    })();
  </script>

  <style>
    .nav-item { padding: 0; }
    .nav-link{
      display:flex;
      align-items:center;
      gap:10px;
      width:100%;
      padding:12px 14px;
      text-decoration:none;
      color:inherit;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .dashboard-hero{ overflow:hidden; isolation:isolate; }
  </style>
</head>

<body class="app-page">

  <!-- ========= SIDEBAR ========= -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="logo-circle">M</div>
      <div class="sidebar-header-text">
        <h1>McTraining</h1>
        <p>Crew &amp; Manager portal</p>
      </div>
      <button id="sidebarToggle" class="sidebar-toggle" type="button">☰</button>
    </div>

    <nav class="sidebar-nav">
      <div class="nav-section-title">MAIN</div>

      <ul class="nav-list">
        <li class="nav-item active">
          <a class="nav-link" data-route="main.html">
            <span class="nav-dot"></span><span class="nav-icon">🏠</span><span class="nav-label">Dashboard</span>
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link" data-route="training.html">
            <span class="nav-dot"></span><span class="nav-icon">🎓</span><span class="nav-label">Training</span>
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link" data-route="schedule.html">
            <span class="nav-dot"></span><span class="nav-icon">📅</span><span class="nav-label">Shifts</span>
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link" data-route="break-rewards.html">
            <span class="nav-dot"></span><span class="nav-icon">🍔</span><span class="nav-label">Break Rewards</span>
          </a>
        </li>

        <li class="nav-item" id="navShiftCreator" style="display:none;">
          <a class="nav-link" data-route="shifts-admin.html">
            <span class="nav-dot"></span><span class="nav-icon">🛠️</span><span class="nav-label">Shift creator</span>
          </a>
        </li>
      </ul>
    </nav>

    <div class="sidebar-footer">
      <div class="sidebar-user-label">
        <strong id="sidebarUserName">User Name</strong><br />
        <span id="sidebarUserRole">Crew Member</span>
      </div>
      <button id="logoutBtn" type="button">Log out</button>
    </div>
  </aside>

  <!-- ========= MAIN LAYOUT ========= -->
  <div class="main-layout">

    <div class="content-area">
      <section class="card section-card dashboard-hero">
        <div class="top-bar">
          <div class="top-bar-left">
            <h2 id="welcomeTitle">Welcome back</h2>
            <p id="welcomeSubtitle">Here’s your shift and progress overview.</p>
          </div>

          <div class="top-bar-right">
            <span id="roleBadge" class="badge-role">CREW</span>
            <button id="myProfileBtn" class="crew-profile-top-btn" style="display:none;" type="button">My profile</button>
            <div id="avatarCircle" class="avatar">U</div>
          </div>
        </div>
      </section>

      <section id="topCards" class="cards-grid"></section>
      <section id="bottomSection" class="card section-card"></section>
    </div>

    <aside class="ai-panel">
      <div class="ai-header">
        <div class="ai-header-left">
          <div class="ai-avatar">A</div>
          <div class="ai-header-text">
            <h3>McAssist</h3>
            <p id="aiSubtitle">Ask about shifts, training or rewards</p>
          </div>
        </div>
        <div class="ai-status"><span class="ai-status-dot"></span><span>Online</span></div>
      </div>

      <div id="aiSuggestions" class="ai-suggestions"></div>
      <div id="aiChat" class="ai-chat"></div>

      <form id="aiForm" class="ai-input-row">
        <input id="aiInput" type="text" placeholder="Ask McAssist something…" />
        <button id="aiSendBtn" type="submit" class="ai-send-btn">Send ➤</button>
        <button type="button" id="aiMicBtn" class="voice-btn">🎤</button>
      </form>

      <label class="wake-toggle">
        <input type="checkbox" id="wakeToggle" />
        <span>Enable “Hey Amy”</span>
      </label>
    </aside>
  </div>

  <script>
    // ✅ Sidebar toggle
    const sidebar = document.getElementById("sidebar");
    const toggleBtn = document.getElementById("sidebarToggle");
    if (toggleBtn && sidebar) {
      toggleBtn.addEventListener("click", () => sidebar.classList.toggle("sidebar-open"));
    }

    // ✅ Fix ALL nav links using app-base
    (function () {
      const BASE = (window.__APP_BASE__ || "").replace(/\/$/, "");
      document.querySelectorAll("a[data-route]").forEach(a => {
        const route = a.getAttribute("data-route");
        a.setAttribute("href", (BASE ? BASE + "/" : "/") + route);
      });
    })();

    // ✅ Load main.js using app-base (prevents 404)
    (function () {
      const BASE = (window.__APP_BASE__ || "").replace(/\/$/, "");
      const s = document.createElement("script");
      s.type = "module";
      s.src = (BASE ? BASE + "/" : "/") + "main.js";
      document.body.appendChild(s);
    })();
  </script>

</body>
</html>
