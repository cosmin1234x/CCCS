<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>McTraining Portal – Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="mc-theme.css" />
</head>
<body class="app-page">

 <nav class="sidebar-nav">
  <div class="nav-section-title">Main</div>
  <ul class="nav-list">
    <li class="nav-item active" onclick="window.location.href='main.html'">
      <span class="nav-dot"></span>
      <span class="nav-icon">🏠</span>
      <span class="nav-label">Dashboard</span>
    </li>
    <li class="nav-item" onclick="window.location.href='training.html'">
      <span class="nav-dot"></span>
      <span class="nav-icon">🎓</span>
      <span class="nav-label">Training</span>
    </li>
    <!-- McAssist page removed -->
  </ul>
</nav>



    <div class="sidebar-footer">
      <div class="sidebar-user-label">
        <strong id="sidebarUserName">User Name</strong><br />
        <span id="sidebarUserRole">Crew Member</span>
      </div>
      <button id="logoutBtn">
        Log out
      </button>
    </div>
  </aside>

  <!-- ========= MAIN LAYOUT ========= -->
  <div class="main-layout">

    <!-- ====== LEFT CONTENT (cards, schedule etc.) ====== -->
    <div class="content-area">

      <!-- Top bar (welcome + role + avatar) -->
      <div class="top-bar">
        <div class="top-bar-left">
          <h2 id="welcomeTitle">Welcome back</h2>
          <p id="welcomeSubtitle">Here’s your week at a glance.</p>
        </div>
        <div class="top-bar-right">
          <span id="roleBadge" class="badge-role">Crew</span>
          <div id="avatarCircle" class="avatar">U</div>
        </div>
      </div>

      <!-- Cards grid (hours/pay or sales/waste) -->
      <section id="topCards" class="cards-grid">
        <!-- Filled by main.js -->
      </section>

      <!-- Section card with schedule / waste / crew list -->
      <section id="bottomSection" class="card section-card">
        <!-- Filled by main.js -->
      </section>
    </div>

    <!-- ====== RIGHT SIDE – McAssist AI PANEL ====== -->
    <aside class="ai-panel">
      <div class="ai-header">
        <div class="ai-header-left">
          <div class="ai-avatar">A</div>
          <div class="ai-header-text">
            <h3>McAssist</h3>
            <p id="aiSubtitle">Ask about your hours, pay or training.</p>
          </div>
        </div>
        <div class="ai-status">
          <span class="ai-status-dot"></span>
          <span>Online</span>
        </div>
      </div>

      <!-- Suggestion chips -->
      <div id="aiSuggestions" class="ai-suggestions">
        <!-- Filled by main.js -->
      </div>

      <!-- Chat area -->
      <div id="aiChat" class="ai-chat">
        <!-- Messages injected by main.js -->
      </div>

      <!-- Input row (text + send + mic) -->
      <form id="aiForm" class="ai-input-row">
        <input
          id="aiInput"
          type="text"
          placeholder="Ask McAssist something…"
          autocomplete="off"
        />
        <button id="aiSendBtn" type="submit" class="ai-send-btn">
          <span>Send</span> ➤
        </button>
        <button type="button" id="aiMicBtn" class="voice-btn">🎤</button>
      </form>

      <!-- Wake word toggle -->
      <label class="wake-toggle">
        <input type="checkbox" id="wakeToggle" />
        <span>Enable “Hey Amy”</span>
      </label>
    </aside>
  </div>

  <!-- ========= VOICE OVERLAY (FULL SCREEN) ========= -->
  <div id="voiceOverlay" class="voice-overlay">
    <div id="overlayText" class="overlay-text">Ask me anything</div>
    <!-- McDonald's-style big mic button -->
    <button id="overlayMic" class="overlay-mic-btn">
      🎤
    </button>

  </div>
  <div id="voiceOverlay" class="voice-overlay">
  <div id="overlayText" class="overlay-text">Ask me anything</div>
  <button id="overlayMic" class="overlay-mic-btn">🎤</button>
</div>

<nav class="sidebar-nav">
  <div class="nav-section-title">Main</div>
  <ul class="nav-list">
    <li class="nav-item active" onclick="window.location.href='main.html'">
      <span class="nav-dot"></span>
      <span class="nav-icon">🏠</span>
      <span class="nav-label">Dashboard</span>
    </li>
    <li class="nav-item" onclick="window.location.href='training.html'">
      <span class="nav-dot"></span>
      <span class="nav-icon">🎓</span>
      <span class="nav-label">Training</span>
    </li>
    <!-- McAssist page removed -->
  </ul>
</nav>


  <!-- Scripts -->
  <script type="module" src="main.js"></script>
</body>
</html>
