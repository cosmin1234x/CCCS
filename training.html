<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>McTraining – Gamified Training</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="mc-training-new.css" />

</head>

<body class="training-app">
<!-- Reward popup system -->
<div id="rewardPopupContainer"></div>

  <!-- ====== SIDEBAR ====== -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="logo-circle">M</div>
      <div>
        <h1>McTraining</h1>
        <p>Training & Development</p>
      </div>
      <button id="sidebarToggle" class="sidebar-toggle">☰</button>
    </div>

    <nav class="sidebar-nav">
      <ul class="nav-list">
        <li onclick="window.location.href='main.html'">🏠 Dashboard</li>
        <li class="active" onclick="window.location.href='training.html'">🎓 Training</li>
        <li onclick="window.location.href='schedule.html'">📅 Shifts</li>
      </ul>
    </nav>

    <div class="sidebar-footer">
      <strong id="sidebarUserName">User</strong><br>
      <span id="sidebarUserRole">Crew</span>
      <button id="logoutBtn">Log out</button>
    </div>
  </aside>

  <!-- ====== TRAINING MODULES SECTION ====== -->
<div id="trainingContent">

  <!-- MODULE GRID -->
  <section class="module-grid" id="moduleGrid">
      <!-- Filled by training-new.js -->
  </section>

  <!-- ACTIVE MODULE VIEW -->
  <section class="active-module" id="activeModuleView" style="display:none;">
      <h2 id="activeModuleTitle"></h2>

      <div id="stageList">
        <!-- Filled dynamically -->
      </div>
  </section>

  <!-- BADGES / REWARDS -->
  <section class="badge-section">
      <h3>Your Badges</h3>
      <div id="badgeGrid"></div>
  </section>

  <!-- Popups -->
  <div id="rewardPopupContainer"></div>

</div>


  <!-- ====== MAIN CONTENT ====== -->
  <main class="main-panel">

    <!-- LEVEL + XP BAR -->
    <section class="xp-header">
      <div class="level-circle" id="levelCircle">1</div>

      <div class="xp-bar-wrapper">
        <div class="xp-bar-fill" id="xpFill"></div>
      </div>

      <div class="xp-label">
        <span id="xpText">0 / 100 XP</span>
      </div>
    </section>

    <!-- BATTLE PASS TRACK -->
    <section class="track-section">
      <h2>Your Training Track</h2>
      <p class="track-sub">Complete modules, earn XP, level up & unlock rewards.</p>

      <div class="track-container" id="trackContainer">
        <!-- training.js fills cards here -->
      </div>
    </section>

    <!-- STORE METRICS (Manager Only) -->
    <section class="manager-metrics" id="managerMetrics"></section>

  </main>

  <!-- ===== MODULE MODAL ===== -->
  <div class="modal" id="moduleModal">
    <div class="modal-box">
      <button class="modal-close" onclick="closeModuleModal()">✕</button>
      <h2 id="moduleTitle"></h2>
      <p id="moduleDescription"></p>

      <button id="startQuizBtn" class="btn-primary">Start Quiz</button>
    </div>
  </div>

  <!-- ===== QUIZ MODAL ===== -->
  <div class="modal" id="quizModal">
    <div class="modal-box quiz-box">
      <button class="modal-close" onclick="closeQuizModal()">✕</button>
      <h2 id="quizTitle"></h2>

      <div id="quizQuestion"></div>
      <div id="quizOptions"></div>

      <button id="submitQuizBtn" class="btn-primary">Submit</button>
    </div>
  </div>

  <!-- ===== LOOT CRATE / REWARD MODAL ===== -->
  <div class="modal" id="rewardModal">
    <div class="modal-box reward-box">
      <h2>🎁 Reward Unlocked!</h2>
      <p id="rewardText"></p>
      <button class="btn-primary" onclick="closeRewardModal()">Collect</button>
    </div>
  </div>

  <script type="module" src="training-new.js"></script>
</body>
</html>
